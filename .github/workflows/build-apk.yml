name: Build debug APK

on:
  push:
    branches:
      - claude/fix-api-ui-components-XkLo2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Find APK
        id: apk
        run: |
          path=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "path=$path" >> "$GITHUB_OUTPUT"
          short=$(git rev-parse --short HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: biji-debug-${{ steps.apk.outputs.short }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ steps.apk.outputs.short }}
          name: "Debug build ${{ steps.apk.outputs.short }}"
          body: |
            Auto-built debug APK from branch `${{ github.ref_name }}` at commit `${{ steps.apk.outputs.short }}`.
            Install with `adb install` or just open the APK on your phone (allow install from unknown sources).
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
